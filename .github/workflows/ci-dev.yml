name: CI Dev Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t intranet-newdeal:dev .

  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy FS scan (vulnerabilities + secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          vuln-type: 'os,library'
          scanners: 'vuln,secret'

  push_dockerhub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: security_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image for Docker Hub
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev